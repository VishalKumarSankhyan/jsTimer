<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clocks</title>

    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        html {
            font-size: 62.5%;
            /* 1 rem 10px */
            /* 1 px 6.25% */
        }



        .container {
            min-height: 100vh;
            width: 100%;
            display: grid;
            place-items: center;

            padding: 3.5rem 5.5rem;
            background-color: hsl(0, 0%, 93%);

        }

        .app {
            width: 350px;
            background-color: white;
            border-radius: 1rem;
            box-shadow: 2px 2px 2px 2px rgba(0, 0, 0, 0.258);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3.8rem;
        }

        .display {
            height: 100px;
            width: 100%;
            background-color: rgb(255, 123, 0);
            color: white;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .display p {
            font-size: 4rem;
            letter-spacing: 0.2rem;
            /* word-spacing: 0.4rem; */
            color: white;
            font-weight: 900;
            font-family: Arial, Helvetica, sans-serif;
            text-transform: uppercase;
        }

        .btn-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            /* grid-template-rows: auto-fill, 3; */
            column-gap: 1rem;
            row-gap: 1.5rem;
            width: 100%;
        }

        button {
            border: 1px solid red;
        }

        .btn {
            padding: 1rem 4rem;
            border-radius: 2rem;
            color: white;
            transition: all 0.3s ease-in-out;
            cursor: pointer;
            background-color: rgb(255, 123, 0);
            border-color: rgb(255, 123, 0);
            /* white-space: nowrap; */
        }

        .btn:hover {
            background-color: transparent;
            color: rgb(255, 123, 0);
        }

        .btn-container .btn:last-of-type {
            grid-column: 1 / -1;
        }

        .record-list {
            width: 100%;
            max-height: 15rem;
            padding: 0.8rem 0rem;
            padding-top: 1.5rem;
            overflow: hidden;
            overflow-y: auto;
            margin-top: 1.5rem;
        }

        .record-list-item {
            background-color: rgb(255, 123, 0);
            border-radius: 1rem;
            color: white;
            width: 100%;
            min-height: 2rem;

            font-size: 1.8rem;
            padding: 1.2rem 2rem;
            margin-bottom: 0.8rem;
            list-style: decimal;
        }

        .record-list-item span {
            margin-right: 1rem;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="app">
            <div class="display">
                <p><span>0</span> SEC</p>
            </div>

            <div class="btn-container">
                <button class="btn">Start</button>
                <button class="btn">Reset</button>
                <button class="btn">Stop</button>
                <button class="btn">Clear</button>
                <button class="btn">Record Time</button>
            </div>

            <ol class="record-list" type="1">

            </ol>
        </div>
    </div>

    <script>
        let display = document.querySelector(".display p");
        let btnContainer = document.querySelector(".btn-container");
        let recordList = document.querySelector(".record-list");

        let timer = 0;
        let timerIntervalId;
        let keyId = 0;

        function displayTimer() {
            display.innerText = timer;
        }

        (() => {
            displayTimer()
        })();

        function startTimer() {
            if (timerIntervalId == undefined && timerIntervalId == null) {
                timerIntervalId = setInterval(() => {
                    timer += 1;
                    displayTimer();
                }, 1000)

            }
        }

        function stoptTimer() {
            if (timerIntervalId != undefined && timerIntervalId != null) {
                clearInterval(timerIntervalId);
                console.log(timerIntervalId);
                timerIntervalId = undefined;
            }
        }

        function resetTimer() {
            if (timerIntervalId != undefined && timerIntervalId != null) {
                clearInterval(timerIntervalId);
                timerIntervalId = undefined;
            }

            timer = 0;
            displayTimer();
        }

        function clearTimer() {
            resetTimer();
            recordList.innerHTML = "";

            // some extra code to remove the records
        }


        function createTimerListElement(data) {
            return `<li class="record-list-item" data-key='${keyId++}'><span>${data}</span> Seconds</li>`;
            
        }

        function recordTime() {
            // recordList.appendChild(createTimerListElement("10"));
            // console.log(recordList);

          if(timer != 0 && timerIntervalId != undefined && timerIntervalId != null){
              recordList.insertAdjacentHTML(
                "beforeend",
                createTimerListElement(timer)
            );
          }
        }



        btnContainer.addEventListener('click', (e) => {

            if (e.target.classList.contains("btn")) {
                console.log(e.target.innerText);

                let operation = e.target.innerText;

                switch (operation) {
                    case 'Start':
                        startTimer();
                        break;
                    case 'Reset':
                        resetTimer();
                        break;
                    case 'Stop':
                        stoptTimer();
                        break;
                    case 'Clear':
                        clearTimer();
                        break;
                    case 'Record Time':
                        recordTime();
                        break;
                    default:
                        alert("Invalid Operation");
                }
            }
            // e.target.classList.closest("btn")
        })

    </script>
</body>

</html>
